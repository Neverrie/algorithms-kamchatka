name: Камчатка · 3D город
on:
  push:
    branches: ['Neverrie/**']
  pull_request:
    paths:
      - 'city_sim/**'
      - 'snowops/**'
      - 'winter_audit/relief.py'
      - 'weather_coverage/geography.py'
      - 'Dockerfile.city-sim*'
      - 'compose.city-sim.yml'
      - 'requirements-city-sim.txt'
      - '.github/workflows/city-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker compose -f compose.city-sim.yml up --build --detach --wait
      - run: docker compose -f compose.city-sim.yml run --rm --no-deps -v "$PWD/city_sim/tests:/checks:ro" city-api python -m unittest discover -s /checks -v
      - run: |
          test "$(docker compose -f compose.city-sim.yml ps --services --status running | sort | paste -sd ' ' -)" = "city-api city-web"
          curl -fsS -o /dev/null http://127.0.0.1:8008/openapi.json
          curl -fsS -o /dev/null http://127.0.0.1:8008/api/v1/operations/weather
          curl -fsS -H 'Content-Type: application/json' -d '{"resolution": 64}' http://127.0.0.1:8008/api/v1/operations/snow -o "$RUNNER_TEMP/snow-study.json"
          python -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["directional_control"]["passes"] and m["metrics"]["calm_flat_pass"]' "$RUNNER_TEMP/snow-study.json"
          python - <<'PY'
          import gzip
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen
          from city_sim.reproduce_city_snow import run

          base = "http://127.0.0.1:8008"
          output = Path(os.environ["RUNNER_TEMP"]) / "citywide-snow"
          output.mkdir()
          city = run(base, {"source": "manual", "wind_speed_ms": 0}, output)["metrics"]
          assert city["computed_tiles"] == city["eligible_tiles"] and city["road_m_covered"] > 100000
          zone = [[158.641, 53.036], [158.643, 53.036], [158.642, 53.037]]
          replay = run(base, {"source": "reanalysis", "event_id": "march-2025", "zone": zone}, output)
          with gzip.open(output / replay["artifact"], "rt") as stream:
              assert len(json.load(stream)["wind_frames"]) == 9
          with urlopen(f"{base}/api/v1/operations/city/runs/{replay['run_id']}/surface?frame=6") as response:
              assert json.load(response)["snow_cm"]
          PY
          curl -fsS -o /dev/null http://127.0.0.1:8008/api/v1/city/metadata
          curl -fsS -o /dev/null http://127.0.0.1:8008/static/vendor/maplibre-gl.js
          curl -fsS -o /dev/null http://127.0.0.1:8008/static/vendor/three.module.min.js
      - if: always()
        run: docker compose -f compose.city-sim.yml logs && docker compose -f compose.city-sim.yml down
