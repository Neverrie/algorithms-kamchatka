name: kamchatka-city-sim
services:
  city-web:
    build:
      context: .
      dockerfile: Dockerfile.city-sim-web
    ports:
      - "127.0.0.1:${CITY_SIM_PORT:-8008}:8080"
    depends_on:
      city-api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 4s
      retries: 8
  city-api:
    build:
      context: .
      dockerfile: Dockerfile.city-sim
      args:
        CITY_SIM_MODEL_SOURCE: ${CITY_SIM_MODEL_SOURCE:-remote-model}
    environment:
      CITY_SIM_DB: /state/city-sim.sqlite3
      CITY_SIM_WEATHER: /atlas-local/heatmaps
      CITY_SIM_SOLVER_URL: ${CITY_SIM_SOLVER_URL:-}
      CITY_SIM_FORECAST_URL: ${CITY_SIM_FORECAST_URL:-}
    volumes:
      - city_sim_state:/state
      - ./weather_coverage:/atlas-local:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; h = json.load(urllib.request.urlopen('http://127.0.0.1:8008/api/v1/health', timeout=4)); assert h['terrain_loaded'] and h['snow_solver_connected'], h"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  city_sim_state:
